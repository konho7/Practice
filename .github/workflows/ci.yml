name: Build and Push to ECR

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: ./mvnw -DskipTests -P MySQL package -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push WAS image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build, tag, and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.apache
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_WEB }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger WAS ASG Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name assac-asg-was \
            --region ${{ secrets.AWS_REGION }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60}'

      - name: Wait for WAS refresh to complete
        run: |
          aws autoscaling wait instance-refresh-successful \
            --auto-scaling-group-name assac-asg-was \
            --region ${{ secrets.AWS_REGION }}

      - name: Trigger Web ASG Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name assac-asg-web \
            --region ${{ secrets.AWS_REGION }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60}'

      - name: Wait for Web refresh to complete
        run: |
          aws autoscaling wait instance-refresh-successful \
            --auto-scaling-group-name assac-asg-web \
            --region ${{ secrets.AWS_REGION }}