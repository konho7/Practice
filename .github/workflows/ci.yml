name: Build and Push to ECR

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: ./mvnw -DskipTests -P MySQL package -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push WAS image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build, tag, and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.apache
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_WEB }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger WAS ASG Instance Refresh and wait
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name assac-asg-was \
            --region ${{ secrets.AWS_REGION }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60}' \
            --query 'InstanceRefreshId' --output text)
          echo "WAS InstanceRefreshId: $REFRESH_ID"
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name assac-asg-was \
              --instance-refresh-ids "$REFRESH_ID" \
              --region ${{ secrets.AWS_REGION }} \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "WAS refresh status: $STATUS"
            if [ "$STATUS" = "Successful" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "WAS instance refresh did not succeed: $STATUS"
              exit 1
            fi
            sleep 15
          done

      - name: Trigger Web ASG Instance Refresh and wait
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name assac-asg-web \
            --region ${{ secrets.AWS_REGION }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60}' \
            --query 'InstanceRefreshId' --output text)
          echo "Web InstanceRefreshId: $REFRESH_ID"
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name assac-asg-web \
              --instance-refresh-ids "$REFRESH_ID" \
              --region ${{ secrets.AWS_REGION }} \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "Web refresh status: $STATUS"
            if [ "$STATUS" = "Successful" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Web instance refresh did not succeed: $STATUS"
              exit 1
            fi
            sleep 15
          done